name: Build GNOME Extension

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Manual trigger support

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip gettext

      - name: Build extension
        run: |
          make compile-schemas
          make compile-locales

      - name: Create extension archive
        run: |
          cp LICENSE extension/
          cd extension
          zip -r ../switch-layout-tiling@shimamu.github.com.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-layout-tiling@shimamu.github.com
          path: switch-layout-tiling@shimamu.github.com.zip
          if-no-files-found: error

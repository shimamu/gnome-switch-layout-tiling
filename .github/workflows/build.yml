name: Build GNOME Extension

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Manual trigger support

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip gettext

      - name: Build extension
        run: |
          make compile-locales

      - name: Create extension archive
        run: |
          cp LICENSE extension

          # Remove unnecessary build and translation artifacts
          rm -f extension/locale/*.pot
          rm -f extension/locale/*/LC_MESSAGES/*.po
          rm -f extension/schemas/gschemas.compiled

          zip -r -v switch-layout-tiling@shimamu.github.com.zip extension

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: switch-layout-tiling@shimamu.github.com
          path: extension
          if-no-files-found: error
